version: 2

models:
  - name: stg_eea__sampling_points
    description: >
      EEA Pan-European sampling-point metadata, one row per sampling point and pollutant.
      The model only renames and casts the upstream values into a consistent staging schema,
      without applying any filtering or business-rule corrections.
    columns:
      - name: country
        description: Country code of the sampling point.
        data_tests:
          - not_null
      - name: sampling_point_id
        description: Sampling point identifier.
        data_tests:
          - not_null
      - name: station_code
        description: EEA air-quality station code associated with the sampling point.
        data_tests:
          - not_null
      - name: air_pollutant
        description: Raw pollutant name as reported by the EEA source before normalization.
        data_tests:
          - not_null
      - name: reporting_year
        description: Reporting year extracted from the source metadata.
      - name: observation_start
        description: Start of the observation period. Null when not reported by the EEA.
      - name: observation_end
        description: End of the observation period. Null when not reported by the EEA.
      - name: imported_at
        description: Timestamp when the source row was imported into the staging layer.
      - name: longitude
        description: Longitude of the sampling point.
      - name: latitude
        description: Latitude of the sampling point.
      - name: altitude
        description: Altitude in meters for the sampling point. Null when the source uses the sentinel value.
      - name: station_type
        description: Type of the air-quality station, such as background or traffic.
        data_tests:
          - not_null
      - name: area_type
        description: Area classification of the air-quality station, such as urban or rural.
        data_tests:
          - not_null
