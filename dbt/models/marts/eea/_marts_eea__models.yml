version: 2

models:
  - name: dim_countries
    description: Dimension table linking each ISO country code to its official country name and the number of stations active in that country.
    columns:
      - name: country_code
        description: ISO 3166-1 alpha-2 country code.
        data_tests:
          - not_null
          - unique
      - name: country_name
        description: Full country name associated with the country code.
        data_tests:
          - not_null
      - name: station_count
        description: Number of distinct sampling stations observed for the country in the deduplicated EEA data.
        data_tests:
          - not_null
