version: 2

models:
  - name: dim_eea__sampling_point
    description: >
      Dimension table containing the latest available EEA sampling-point metadata for the
      pollutants used in the project. The model keeps only the most recent record per
      station and filters to the core set of pollutants in scope.
    columns:
      - name: country
        description: Country code recorded for the sampling point.
        data_tests:
          - not_null
      - name: sampling_point_id
        description: Unique sampling point identifier.
        data_tests:
          - not_null
      - name: station_code
        description: EEA air-quality station code associated with the sampling point.
        data_tests:
          - not_null
      - name: air_pollutant
        description: Pollutant name retained in the latest metadata snapshot.
      - name: reporting_year
        description: Reporting year for the selected metadata row.
      - name: observation_start
        description: Start of the observation period for the latest metadata record.
      - name: observation_end
        description: End of the observation period if reported by the source metadata.
      - name: imported_at
        description: Timestamp when the selected metadata row was imported.
      - name: longitude
        description: Longitude coordinate of the sampling point.
      - name: latitude
        description: Latitude coordinate of the sampling point.
      - name: altitude
        description: Altitude in meters for the sampling point when reported.
      - name: station_type
        description: Type of the air-quality station, such as background or traffic.
        data_tests:
          - not_null
      - name: area_type
        description: Area classification of the station, such as urban or rural.
        data_tests:
          - not_null

  - name: dim_stations
    description: >
      Yearly station coverage summary comparing the valid measurement points against the
      EEA sampling-point metadata dimension to estimate matching coverage.
    columns:
      - name: n_in_measurements
        description: Count of distinct sampling points present in measurements for the project scope.
      - name: n_with_coordinates
        description: Count of distinct sampling points that exist in the coordinate metadata dimension.
      - name: year
        description: Year analyzed in the summary.
      - name: n_points
        description: Number of unique measurement points observed in that year.
      - name: pct_matched
        description: Percentage of points in the measurement layer that match a station in the dimension table.